<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Menlo,Consolas,monospace">
  <!-- ============ background ============ -->
  <rect x="0" y="0" width="900" height="620" fill="#0f1115"/>
  <text x="450" y="30" text-anchor="middle" fill="#ff7a2f" font-size="18" font-weight="bold">LC78 OFFROAD — Breadboard Wiring</text>
  <text x="450" y="48" text-anchor="middle" fill="#9aa4b2" font-size="12">Arduino UNO R4 WiFi · SH1106 OLED · DS18B20 + DHT22 · active buzzer</text>

  <!-- ============ breadboard ============ -->
  <rect x="40" y="300" width="500" height="250" rx="10" fill="#e9e6da" stroke="#cfcabc"/>
  <!-- power rails top -->
  <rect x="40" y="306" width="500" height="26" fill="#efece2"/>
  <line x1="55" y1="312" x2="525" y2="312" stroke="#ff5252" stroke-width="2"/>
  <line x1="55" y1="326" x2="525" y2="326" stroke="#2a6fd6" stroke-width="2"/>
  <text x="46" y="316" fill="#ff5252" font-size="9">+</text>
  <text x="46" y="330" fill="#2a6fd6" font-size="9">−</text>
  <!-- power rails bottom -->
  <rect x="40" y="520" width="500" height="26" fill="#efece2"/>
  <line x1="55" y1="527" x2="525" y2="527" stroke="#ff5252" stroke-width="2"/>
  <line x1="55" y1="540" x2="525" y2="540" stroke="#2a6fd6" stroke-width="2"/>

  <!-- hole grid (center area) -->
  <g fill="#b9b4a5">
    <!-- draw a sparse dot matrix to suggest tie points -->
    <!-- rows A-E (top half) and F-J (bottom half) -->
    <!-- top block -->
    <g>
      <!-- 15 columns x 5 rows -->
      <!-- generated-ish: use loops manually spaced 30px -->
      <!-- y rows: 348 362 376 390 404 -->
      <!-- x cols from 70 step 30 -->
      <!-- top -->
      <g>
        <circle cx="70" cy="348" r="2.5"/><circle cx="100" cy="348" r="2.5"/><circle cx="130" cy="348" r="2.5"/><circle cx="160" cy="348" r="2.5"/><circle cx="190" cy="348" r="2.5"/><circle cx="220" cy="348" r="2.5"/><circle cx="250" cy="348" r="2.5"/><circle cx="280" cy="348" r="2.5"/><circle cx="310" cy="348" r="2.5"/><circle cx="340" cy="348" r="2.5"/><circle cx="370" cy="348" r="2.5"/><circle cx="400" cy="348" r="2.5"/><circle cx="430" cy="348" r="2.5"/><circle cx="460" cy="348" r="2.5"/><circle cx="490" cy="348" r="2.5"/>
        <circle cx="70" cy="366" r="2.5"/><circle cx="100" cy="366" r="2.5"/><circle cx="130" cy="366" r="2.5"/><circle cx="160" cy="366" r="2.5"/><circle cx="190" cy="366" r="2.5"/><circle cx="220" cy="366" r="2.5"/><circle cx="250" cy="366" r="2.5"/><circle cx="280" cy="366" r="2.5"/><circle cx="310" cy="366" r="2.5"/><circle cx="340" cy="366" r="2.5"/><circle cx="370" cy="366" r="2.5"/><circle cx="400" cy="366" r="2.5"/><circle cx="430" cy="366" r="2.5"/><circle cx="460" cy="366" r="2.5"/><circle cx="490" cy="366" r="2.5"/>
        <circle cx="70" cy="384" r="2.5"/><circle cx="100" cy="384" r="2.5"/><circle cx="130" cy="384" r="2.5"/><circle cx="160" cy="384" r="2.5"/><circle cx="190" cy="384" r="2.5"/><circle cx="220" cy="384" r="2.5"/><circle cx="250" cy="384" r="2.5"/><circle cx="280" cy="384" r="2.5"/><circle cx="310" cy="384" r="2.5"/><circle cx="340" cy="384" r="2.5"/><circle cx="370" cy="384" r="2.5"/><circle cx="400" cy="384" r="2.5"/><circle cx="430" cy="384" r="2.5"/><circle cx="460" cy="384" r="2.5"/><circle cx="490" cy="384" r="2.5"/>
      </g>
      <!-- center trench -->
      <!-- bottom block -->
      <g>
        <circle cx="70" cy="430" r="2.5"/><circle cx="100" cy="430" r="2.5"/><circle cx="130" cy="430" r="2.5"/><circle cx="160" cy="430" r="2.5"/><circle cx="190" cy="430" r="2.5"/><circle cx="220" cy="430" r="2.5"/><circle cx="250" cy="430" r="2.5"/><circle cx="280" cy="430" r="2.5"/><circle cx="310" cy="430" r="2.5"/><circle cx="340" cy="430" r="2.5"/><circle cx="370" cy="430" r="2.5"/><circle cx="400" cy="430" r="2.5"/><circle cx="430" cy="430" r="2.5"/><circle cx="460" cy="430" r="2.5"/><circle cx="490" cy="430" r="2.5"/>
        <circle cx="70" cy="448" r="2.5"/><circle cx="100" cy="448" r="2.5"/><circle cx="130" cy="448" r="2.5"/><circle cx="160" cy="448" r="2.5"/><circle cx="190" cy="448" r="2.5"/><circle cx="220" cy="448" r="2.5"/><circle cx="250" cy="448" r="2.5"/><circle cx="280" cy="448" r="2.5"/><circle cx="310" cy="448" r="2.5"/><circle cx="340" cy="448" r="2.5"/><circle cx="370" cy="448" r="2.5"/><circle cx="400" cy="448" r="2.5"/><circle cx="430" cy="448" r="2.5"/><circle cx="460" cy="448" r="2.5"/><circle cx="490" cy="448" r="2.5"/>
        <circle cx="70" cy="466" r="2.5"/><circle cx="100" cy="466" r="2.5"/><circle cx="130" cy="466" r="2.5"/><circle cx="160" cy="466" r="2.5"/><circle cx="190" cy="466" r="2.5"/><circle cx="220" cy="466" r="2.5"/><circle cx="250" cy="466" r="2.5"/><circle cx="280" cy="466" r="2.5"/><circle cx="310" cy="466" r="2.5"/><circle cx="340" cy="466" r="2.5"/><circle cx="370" cy="466" r="2.5"/><circle cx="400" cy="466" r="2.5"/><circle cx="430" cy="466" r="2.5"/><circle cx="460" cy="466" r="2.5"/><circle cx="490" cy="466" r="2.5"/>
      </g>
    </g>
  </g>
  <line x1="55" y1="407" x2="525" y2="407" stroke="#cfcabc" stroke-width="6"/>
  <text x="530" y="360" fill="#777" font-size="9">A-E</text>
  <text x="530" y="450" fill="#777" font-size="9">F-J</text>

  <!-- ============ Arduino UNO R4 ============ -->
  <rect x="610" y="300" width="250" height="250" rx="8" fill="#0a7d8c" stroke="#064e58"/>
  <text x="735" y="320" text-anchor="middle" fill="#d6eef2" font-size="12" font-weight="bold">Arduino UNO R4 WiFi</text>
  <!-- digital header -->
  <g font-size="9" fill="#d6eef2">
    <rect x="625" y="330" width="220" height="20" fill="#064e58"/>
    <text x="640" y="344">D2</text><circle cx="648" cy="358" r="4" fill="#111"/>
    <text x="672" y="344">D3</text><circle cx="680" cy="358" r="4" fill="#111"/>
    <text x="704" y="344">D4</text><circle cx="712" cy="358" r="4" fill="#111"/>
  </g>
  <!-- analog + power header (bottom) -->
  <g font-size="9" fill="#d6eef2">
    <rect x="625" y="500" width="220" height="20" fill="#064e58"/>
    <circle cx="648" cy="494" r="4" fill="#111"/><text x="636" y="534">A4</text>
    <circle cx="680" cy="494" r="4" fill="#111"/><text x="668" y="534">A5</text>
    <circle cx="760" cy="494" r="4" fill="#111"/><text x="748" y="534">5V</text>
    <circle cx="800" cy="494" r="4" fill="#111"/><text x="786" y="534">GND</text>
  </g>

  <!-- ============ components on/near breadboard ============ -->
  <!-- OLED module -->
  <rect x="70" y="150" width="150" height="70" rx="6" fill="#111" stroke="#444"/>
  <rect x="80" y="160" width="130" height="38" fill="#0a2a3a"/>
  <text x="145" y="214" text-anchor="middle" fill="#4ea1ff" font-size="10">SH1106 OLED</text>
  <g font-size="8" fill="#ddd">
    <circle cx="90" cy="226" r="3" fill="#c9a94b"/><text x="84" y="242">GND</text>
    <circle cx="112" cy="226" r="3" fill="#c9a94b"/><text x="108" y="242">VCC</text>
    <circle cx="134" cy="226" r="3" fill="#c9a94b"/><text x="128" y="242">SCL</text>
    <circle cx="156" cy="226" r="3" fill="#c9a94b"/><text x="150" y="242">SDA</text>
  </g>

  <!-- DS18B20 probe -->
  <rect x="270" y="150" width="120" height="44" rx="6" fill="#1b2330" stroke="#ff7a2f"/>
  <text x="330" y="176" text-anchor="middle" fill="#ff7a2f" font-size="10">DS18B20 water</text>
  <g font-size="8" fill="#ddd">
    <circle cx="290" cy="200" r="3" fill="#ff5252"/><text x="283" y="214">Red</text>
    <circle cx="330" cy="200" r="3" fill="#c9a94b"/><text x="320" y="214">Yel</text>
    <circle cx="370" cy="200" r="3" fill="#222"/><text x="360" y="214">Blk</text>
  </g>

  <!-- DHT22 -->
  <rect x="420" y="150" width="90" height="44" rx="6" fill="#1b2330" stroke="#9b59ff"/>
  <text x="465" y="176" text-anchor="middle" fill="#9b59ff" font-size="10">DHT22 air</text>
  <g font-size="8" fill="#ddd">
    <circle cx="435" cy="200" r="3" fill="#ff5252"/><text x="426" y="214">VCC</text>
    <circle cx="465" cy="200" r="3" fill="#c9a94b"/><text x="454" y="214">DAT</text>
    <circle cx="495" cy="200" r="3" fill="#222"/><text x="486" y="214">GND</text>
  </g>

  <!-- buzzer -->
  <circle cx="200" cy="470" r="22" fill="#111" stroke="#ff7a2f"/>
  <circle cx="200" cy="470" r="6" fill="#333"/>
  <text x="200" y="506" text-anchor="middle" fill="#ff7a2f" font-size="9">BUZZER</text>
  <text x="188" y="452" fill="#ff5252" font-size="9">+</text>
  <text x="214" y="452" fill="#2a6fd6" font-size="9">−</text>

  <!-- 4.7k resistor across DATA->5V (near DS18B20 on board) -->
  <g>
    <rect x="300" y="430" width="60" height="12" rx="3" fill="#d9cdae" stroke="#a89a74"/>
    <text x="330" y="426" text-anchor="middle" fill="#f5c04e" font-size="9">R1 4.7k</text>
    <line x1="290" y1="436" x2="300" y2="436" stroke="#777" stroke-width="2"/>
    <line x1="360" y1="436" x2="370" y2="436" stroke="#777" stroke-width="2"/>
  </g>

  <!-- ============ wires ============ -->
  <!-- OLED SDA -> A4 (blue) -->
  <path d="M156 229 L156 290 L648 290 L648 490" fill="none" stroke="#4ea1ff" stroke-width="2.5"/>
  <!-- OLED SCL -> A5 (blue) -->
  <path d="M134 229 L134 284 L680 284 L680 490" fill="none" stroke="#4ea1ff" stroke-width="2.5"/>
  <!-- OLED VCC -> +rail (red) -->
  <path d="M112 229 L112 312" fill="none" stroke="#ff5252" stroke-width="2.5"/>
  <!-- OLED GND -> -rail (blue/black) -->
  <path d="M90 229 L90 326" fill="none" stroke="#2a6fd6" stroke-width="2.5"/>

  <!-- DS18B20 DATA(Yel) -> D2 (yellow) -->
  <path d="M330 204 L330 270 L648 270 L648 353" fill="none" stroke="#f5c04e" stroke-width="2.5"/>
  <!-- DS18B20 Red -> +rail -->
  <path d="M290 204 L290 312" fill="none" stroke="#ff5252" stroke-width="2.5"/>
  <!-- DS18B20 Blk -> -rail -->
  <path d="M370 204 L370 326" fill="none" stroke="#2a6fd6" stroke-width="2.5"/>
  <!-- 4.7k: DATA node -> +rail -->
  <path d="M290 436 L290 384 L330 384 L330 270" fill="none" stroke="#f5c04e" stroke-width="1.6" stroke-dasharray="4 3"/>
  <path d="M370 436 L420 436 L420 312" fill="none" stroke="#ff5252" stroke-width="1.6" stroke-dasharray="4 3"/>

  <!-- DHT22 DATA -> D4 (purple) -->
  <path d="M465 204 L465 264 L712 264 L712 353" fill="none" stroke="#9b59ff" stroke-width="2.5"/>
  <!-- DHT22 VCC -> +rail -->
  <path d="M435 204 L435 312" fill="none" stroke="#ff5252" stroke-width="2.5"/>
  <!-- DHT22 GND -> -rail -->
  <path d="M495 204 L495 326" fill="none" stroke="#2a6fd6" stroke-width="2.5"/>

  <!-- buzzer + -> D3 (orange) -->
  <path d="M190 450 L190 420 L560 420 L560 358 L680 358" fill="none" stroke="#ff7a2f" stroke-width="2.5"/>
  <!-- buzzer - -> -rail -->
  <path d="M214 452 L214 527" fill="none" stroke="#2a6fd6" stroke-width="2.5"/>

  <!-- rails to Arduino 5V / GND -->
  <path d="M525 312 L585 312 L585 494 L760 494" fill="none" stroke="#ff5252" stroke-width="2.5"/>
  <path d="M525 527 L575 527 L575 480 L800 480 L800 494" fill="none" stroke="#2a6fd6" stroke-width="2.5"/>

  <!-- ============ legend ============ -->
  <g font-size="10">
    <rect x="610" y="150" width="250" height="110" rx="8" fill="#171a21" stroke="#2a2f3a"/>
    <text x="620" y="168" fill="#e6e9ef" font-weight="bold">Wire colours</text>
    <line x1="620" y1="180" x2="642" y2="180" stroke="#ff5252" stroke-width="3"/><text x="650" y="184" fill="#9aa4b2">5V (red)</text>
    <line x1="620" y1="196" x2="642" y2="196" stroke="#2a6fd6" stroke-width="3"/><text x="650" y="200" fill="#9aa4b2">GND (blue/black)</text>
    <line x1="620" y1="212" x2="642" y2="212" stroke="#4ea1ff" stroke-width="3"/><text x="650" y="216" fill="#9aa4b2">I2C SDA/SCL → A4/A5</text>
    <line x1="620" y1="228" x2="642" y2="228" stroke="#f5c04e" stroke-width="3"/><text x="650" y="232" fill="#9aa4b2">DS18B20 DATA → D2 (+4.7k)</text>
    <line x1="620" y1="244" x2="642" y2="244" stroke="#9b59ff" stroke-width="3"/><text x="650" y="248" fill="#9aa4b2">DHT22 DATA → D4</text>
    <line x1="750" y1="244" x2="772" y2="244" stroke="#ff7a2f" stroke-width="3"/><text x="780" y="248" fill="#9aa4b2">BZ+ → D3</text>
  </g>

  <text x="450" y="600" text-anchor="middle" fill="#60656f" font-size="10">Breadboard view · common + rail = 5V, − rail = GND · 4.7k pulls DS18B20 DATA up to 5V</text>
</svg>
