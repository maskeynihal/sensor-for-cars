# Mode B (direct). The custom chip "sender" (chips/hj60-sender.chip.c) stands
# in for 3.3 V -> Rref 100 ohm -> sender. It outputs Vtop/2 on GPIO34 and Vs on
# GPIO35 only while GPIO26 (excitation) is high, like the real circuit.
# The battery is a potentiometer on GPIO32: 0.437 -> ~12.9 V.
# Wokwi's ESP32 ADC model adds an offset of about +0.14 V. The offset does not
# cancel in the ratio, so the sim reads low at the hot end (85 C -> ~76 C,
# 115 C -> ~97 C). The real board gets ADC_OFFSET_MV from step M5. Thus the
# scenario uses 145 C for ALARM and checks states, not exact temperatures.
# Pulsing, bounce and mode A are covered by the native tests.
name: 'hj60_coolant smoke (mode B)'
version: 1
author: 'maskeynihal'
steps:
  - wait-serial: 'hj60_coolant boot ok'
  - set-control:
      part-id: batt
      name: position
      value: 0.437
  - set-control:
      part-id: sender
      name: temperature
      value: 85
  - delay: 1500ms
  - wait-serial: 'Mode:B  State:OK'
  - expect-pin:
      part-id: mcu
      name: 25
      value: 0

  - set-control:
      part-id: sender
      name: temperature
      value: 145
  - wait-serial: 'State:ALARM'
  - delay: 200ms
  - expect-pin:
      part-id: mcu
      name: 25
      value: 1

  - set-control:
      part-id: sender
      name: open
      value: 1
  - wait-serial: 'State:FAULT-OPEN'

  - set-control:
      part-id: sender
      name: open
      value: 0
  - set-control:
      part-id: sender
      name: backfeed
      value: 3.3
  - wait-serial: 'State:FAULT-BACKFEED'
  - delay: 3000ms
